services:
  - type: web
    name: wamutailor-management-eu
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: wamutailor-db
          property: connectionString
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: CLIENT_TOKEN_SECRET
        generateValue: true

databases:
  - name: wamutailor-db
    databaseName: wamutailor
    user: wamutailor_admin
    plan: free
